<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-labelledby="title description">
  <title id="title">GuidGenerator core library architecture</title>
  <desc id="description">A layered diagram showing public generator and GUID utility APIs, version-specific generator strategies, shared component codecs and providers, and System.Guid values.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b3a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #526575; }
      .layer { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; fill: #466071; }
      .card-title { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; fill: #415566; }
      .small { font-size: 12px; fill: #536879; }
      .mono { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1b4b5a; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .soft-edge { fill: none; stroke: #94a3b0; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="1080" fill="#f3f7f8" />
  <text x="64" y="56" class="title">GuidGenerator Core Library</text>
  <text x="64" y="82" class="subtitle">Public APIs, version strategies, field codecs, and generation state</text>

  <rect x="44" y="104" width="1192" height="166" rx="14" fill="#e5f1f2" stroke="#b7d5d8" />
  <text x="68" y="132" class="layer">PUBLIC API</text>
  <rect x="68" y="148" width="545" height="98" rx="10" fill="#ffffff" stroke="#78aeb4" stroke-width="1.5" />
  <rect x="68" y="148" width="7" height="98" rx="3" fill="#25808a" />
  <text x="92" y="176" class="card-title">Generator API</text>
  <text x="92" y="199" class="mono">GuidGenerator.VersionX / OfVersion(...)</text>
  <text x="92" y="222" class="body">IGuidGenerator.NewGuid(...) and custom-state builder</text>

  <rect x="667" y="148" width="545" height="98" rx="10" fill="#ffffff" stroke="#78aeb4" stroke-width="1.5" />
  <rect x="667" y="148" width="7" height="98" rx="3" fill="#25808a" />
  <text x="691" y="176" class="card-title">GUID Utility API</text>
  <text x="691" y="199" class="mono">GuidExtensions / Uuid / GuidConvert</text>
  <text x="691" y="222" class="body">Inspect, replace, build, parse, format, and convert</text>

  <rect x="44" y="296" width="1192" height="366" rx="14" fill="#f9f3e7" stroke="#e2c995" />
  <text x="68" y="325" class="layer">VERSION-SPECIFIC GENERATION STRATEGIES</text>

  <rect x="68" y="344" width="545" height="112" rx="10" fill="#ffffff" stroke="#d2ad62" stroke-width="1.5" />
  <text x="91" y="373" class="card-title">Time-based</text>
  <text x="91" y="399" class="mono">TimeBasedGuidGenerator</text>
  <text x="91" y="425" class="body">v1 and v6: timestamp, clock sequence, node ID</text>

  <rect x="667" y="344" width="545" height="112" rx="10" fill="#ffffff" stroke="#d2ad62" stroke-width="1.5" />
  <text x="690" y="373" class="card-title">Name-based</text>
  <text x="690" y="399" class="mono">NameBasedGuidGenerator</text>
  <text x="690" y="425" class="body">v3 (MD5) and v5 (SHA-1): namespace plus name</text>

  <rect x="68" y="476" width="545" height="112" rx="10" fill="#ffffff" stroke="#d2ad62" stroke-width="1.5" />
  <text x="91" y="505" class="card-title">DCE Security and random</text>
  <text x="91" y="531" class="mono">DceSecurityGuidGenerator / RandomGuidGenerator</text>
  <text x="91" y="557" class="body">v2: local ID; v4: random data</text>

  <rect x="667" y="476" width="545" height="112" rx="10" fill="#ffffff" stroke="#d2ad62" stroke-width="1.5" />
  <text x="690" y="505" class="card-title">Unix-time and custom</text>
  <text x="690" y="531" class="mono">UnixTimeBasedGuidGenerator / CustomGuidGenerator</text>
  <text x="690" y="557" class="body">v7: Unix timestamp; v8: application-defined data</text>

  <text x="68" y="628" class="small">The factory selects a strategy by version; each strategy constructs RFC variant/version fields in its output.</text>

  <path d="M 340 270 L 340 296" class="edge" />
  <path d="M 940 270 L 940 282 L 1248 282 L 1248 674 L 340 674 L 340 728" class="edge" />

  <rect x="44" y="688" width="1192" height="270" rx="14" fill="#eaf0f6" stroke="#bdcddd" />
  <text x="68" y="717" class="layer">SHARED FIELD MODEL AND RUNTIME SERVICES</text>

  <rect x="68" y="738" width="545" height="184" rx="10" fill="#ffffff" stroke="#8ba8c1" stroke-width="1.5" />
  <rect x="68" y="738" width="7" height="184" rx="3" fill="#537da0" />
  <text x="92" y="768" class="card-title">RFC field components</text>
  <text x="92" y="795" class="mono">GuidComponents.OfVersion(version)</text>
  <text x="92" y="824" class="body">Version-specific codecs for timestamps, node IDs,</text>
  <text x="92" y="846" class="body">hash/random/custom data, variant, and version bits.</text>
  <text x="92" y="884" class="small">Used by generators and public field inspection/replacement APIs.</text>

  <rect x="667" y="738" width="545" height="184" rx="10" fill="#ffffff" stroke="#8ba8c1" stroke-width="1.5" />
  <rect x="667" y="738" width="7" height="184" rx="3" fill="#537da0" />
  <text x="691" y="768" class="card-title">Providers and generator state</text>
  <text x="691" y="797" class="body">Timestamp · node ID · local ID · hash/random sources</text>
  <text x="691" y="824" class="body">Clock sequence · monotonicity/reset counters</text>
  <text x="691" y="851" class="body">Optional state persistence and custom providers</text>
  <text x="691" y="884" class="small">Supplies per-version strategies with their required inputs.</text>

  <path d="M 640 662 L 640 680 L 340 680 L 340 728" class="edge" />
  <path d="M 640 662 L 640 680 L 940 680 L 940 728" class="edge" />

  <path d="M 340 922 L 340 980 L 640 980" class="edge" />
  <path d="M 940 922 L 940 980 L 640 980" class="edge" />
  <rect x="442" y="994" width="396" height="54" rx="27" fill="#d9ece5" stroke="#82b9a0" stroke-width="1.5" />
  <text x="640" y="1027" text-anchor="middle" class="card-title">System.Guid values</text>
</svg>
